<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>exa — Safras</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;450;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
:root {
  --ink-900: #0a0d14; --ink-800: #14171f; --ink-700: #1f242e;
  --ink-600: #2c3340; --ink-500: #4a5160; --ink-400: #6b7280;
  --ink-300: #8a93a3; --ink-200: #b9bfc9; --ink-100: #dde1e8; --ink-50: #eef0f4;
  --paper: #fbfaf7; --paper-2: #f5f3ee; --card: #ffffff;
  --hair: #e7e4dc; --hair-2: #efece5;
  --exa-700: #1a2dc9; --exa-600: #2540ea; --exa-500: #3a5bff;
  --exa-100: #e6ebff; --exa-50: #f2f4ff;
  --good-700: #15683a; --good-500: #1f9d57; --good-100: #d1f0de; --good-50: #ecf6ef;
  --warn-700: #8a4b00; --warn-500: #c66a00; --warn-100: #ffe4b3; --warn-50: #fff7ed;
  --bad-700: #9a1f2a; --bad-600: #b8232f; --bad-500: #d62a39;
  --bad-100: #fbd0d4; --bad-50: #fbecee;
  --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-serif: "Instrument Serif", "Times New Roman", serif;
  --sidebar-w: 232px; --content-pad: 32px;
  --radius-sm: 6px; --radius: 10px; --radius-lg: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-feature-settings: "ss01","cv11";
  color: var(--ink-900);
  background: var(--paper);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }

/* Layout */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

/* Sidebar */
.sidebar {
  background: var(--ink-900); color: var(--ink-200);
  padding: 22px 16px 24px;
  display: flex; flex-direction: column; gap: 28px;
  position: sticky; top: 0; height: 100vh;
}
.sb-brand { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px 0; }
.sb-brand .wordmark { font-family: var(--font-serif); font-style: italic; font-size: 38px; color: #fff; letter-spacing: -0.02em; line-height: 1; }
.sb-brand .meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-400); letter-spacing: 0.08em; text-transform: uppercase; }
.sb-section-label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-400); letter-spacing: 0.12em; text-transform: uppercase; padding: 0 10px 6px; }
.sb-nav { display: flex; flex-direction: column; gap: 1px; }
.sb-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--ink-200); font-size: 13px; font-weight: 450; cursor: pointer; transition: background 120ms ease, color 120ms ease; border: 1px solid transparent; }
.sb-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
.sb-item.active { background: rgba(255,255,255,0.06); color: #fff; border-color: rgba(255,255,255,0.08); }
.sb-item .ico { color: var(--ink-300); }
.sb-item.active .ico { color: var(--exa-500); }
.sb-item .chev { margin-left: auto; opacity: 0.4; }
.sb-footer { margin-top: auto; padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 10px; color: var(--ink-300); font-size: 12px; }
.sb-avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg,#2540ea,#6b7280); display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 600; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; }

/* Topbar */
.topbar { display: flex; align-items: center; gap: 8px; padding: 12px var(--content-pad); border-bottom: 1px solid var(--hair); background: var(--paper); position: sticky; top: 0; z-index: 10; backdrop-filter: saturate(140%) blur(8px); flex-wrap: wrap; row-gap: 8px; }
.tb-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.filter { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 12px; background: var(--card); border: 1px solid var(--hair); border-radius: 7px; font-size: 12.5px; color: var(--ink-700); cursor: pointer; }
.filter .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-400); }
.filter .val { font-weight: 500; color: var(--ink-800); }
.daterange { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--card); border: 1px solid var(--hair); border-radius: 7px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-700); }
.daterange .arrow { color: var(--ink-300); }
.status-pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 8px; border: 1px solid var(--hair); border-radius: 999px; background: var(--card); font-size: 11.5px; color: var(--ink-500); font-family: var(--font-mono); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good-500); box-shadow: 0 0 0 3px rgba(31,157,87,0.15); }

/* Page */
.page { padding: 28px var(--content-pad) 56px; display: flex; flex-direction: column; gap: 32px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 8px; }
.page-head .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-400); margin-bottom: 10px; }
.page-head h1 { font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: 56px; line-height: 1; letter-spacing: -0.02em; color: var(--ink-900); margin: 0 0 10px; }
.page-head .lede { font-size: 15px; color: var(--ink-500); max-width: 56ch; letter-spacing: -0.005em; }
.head-aside { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.head-base { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-400); }
.head-base b { color: var(--ink-800); font-weight: 500; }

/* Section */
.section { display: flex; flex-direction: column; gap: 14px; }
.section-head { display: flex; align-items: center; gap: 12px; }
.section-head .tag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-500); }
.section-head .rule { flex: 1; height: 1px; background: linear-gradient(to right, var(--ink-100), transparent); }

/* Resumo KPIs */
.resumo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: var(--radius-lg); overflow: hidden; }
.resumo-kpi { background: var(--card); padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 6px; }
.resumo-kpi .r-lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-400); }
.resumo-kpi .r-val { font-size: clamp(22px, 1.9vw, 28px); font-weight: 500; letter-spacing: -0.025em; color: var(--ink-900); line-height: 1; font-feature-settings: "tnum" 1; }
.resumo-kpi .r-sub { font-size: 12px; color: var(--ink-400); }
/* STD ate 7d = metrica principal */
.resumo-kpi.destaque { background: linear-gradient(180deg, var(--good-50), var(--card) 70%); box-shadow: inset 0 2px 0 var(--good-500); }
table.safras td.std-main { background: var(--good-50); color: var(--good-700); }
table.safras tr.maturando td.std-main { background: var(--paper-2); color: var(--ink-500); }

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge.bad  { background: var(--bad-50);  color: var(--bad-700);  border: 1px solid var(--bad-100); }
.badge.warn { background: var(--warn-50); color: var(--warn-700); border: 1px solid var(--warn-100); }
.badge.good { background: var(--good-50); color: var(--good-700); border: 1px solid var(--good-100); }

/* Funil */
.funil-wrap { background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius-lg); padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.funil-step { display: grid; grid-template-columns: 150px 1fr 150px; align-items: center; gap: 14px; }
.funil-lbl { font-size: 12.5px; font-weight: 500; color: var(--ink-700); }
.funil-track { height: 30px; background: var(--paper-2); border-radius: var(--radius-sm); position: relative; overflow: hidden; }
.funil-fill { height: 100%; border-radius: var(--radius-sm); background: linear-gradient(90deg, var(--exa-600), var(--exa-500)); transition: width 0.7s cubic-bezier(0.16,1,0.3,1); display: flex; align-items: center; padding-left: 10px; }
.funil-fill.alt { background: linear-gradient(90deg, #15683a, #1f9d57); }
.funil-fill-lbl { font-family: var(--font-mono); font-size: 11px; color: #fff; font-weight: 600; white-space: nowrap; }
.funil-right { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.funil-qtd { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--ink-900); font-feature-settings: "tnum" 1; }
.funil-pct { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-400); }
.funil-note { font-size: 11px; color: var(--ink-400); padding-top: 4px; border-top: 1px solid var(--hair-2); margin-top: 4px; }

/* Grafico de evolucao STD */
.chart-wrap { background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius-lg); padding: 20px 22px 16px; }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
.chart-title { font-size: 14px; font-weight: 600; color: var(--ink-900); }
.chart-sub { font-size: 12px; color: var(--ink-400); margin-top: 2px; }
.chart-legend { display: flex; gap: 16px; align-items: center; }
.chart-legend .li { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-600); }
.chart-legend .sw { width: 20px; height: 10px; position: relative; flex-shrink: 0; }
.chart-legend .sw i { position: absolute; top: 4px; left: 0; right: 0; height: 2px; }
.chart-legend .sw b { position: absolute; top: 2px; left: 6px; width: 6px; height: 6px; }
.chart-readout { display: flex; align-items: baseline; gap: 14px; margin: 8px 0 10px; flex-wrap: wrap; font-size: 12.5px; }
.chart-readout .ro-wk { font-family: var(--font-mono); font-size: 11px; color: var(--ink-500); background: var(--paper-2); padding: 2px 8px; border-radius: 999px; }
.chart-readout .ro-v { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-700); }
.chart-readout .ro-v b { font-feature-settings: "tnum" 1; }
.chart-readout .ro-dot { width: 9px; height: 9px; border-radius: 2px; }
.chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-grid line { stroke: var(--hair-2); stroke-width: 1; }
.chart-zero { stroke: var(--ink-100); stroke-width: 1; }
.chart-axis-lbl { font-family: var(--font-mono); font-size: 7px; fill: var(--ink-400); }
.chart-hit { fill: transparent; cursor: crosshair; }
.chart-cross { stroke: var(--ink-300); stroke-width: 1; stroke-dasharray: 3 3; }

/* Tabs */
.tabs { display: inline-flex; gap: 2px; background: var(--paper-2); border: 1px solid var(--hair); border-radius: 8px; padding: 3px; }
.tab-btn { padding: 6px 16px; border: none; background: transparent; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-500); transition: all 120ms ease; }
.tab-btn.active { background: var(--card); color: var(--ink-900); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

/* Tabela */
.tabela-wrap { background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius-lg); overflow: hidden; }
.tabela-scroll { overflow-x: auto; }
table.safras { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.safras th {
  text-align: right; padding: 10px 14px; background: var(--paper-2);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-400); font-weight: 500; border-bottom: 1px solid var(--hair); white-space: nowrap;
}
table.safras th:first-child, table.safras td:first-child { text-align: left; }
table.safras td {
  text-align: right; padding: 9px 14px; border-bottom: 1px solid var(--hair-2);
  font-feature-settings: "tnum" 1; color: var(--ink-700); white-space: nowrap;
}
table.safras tr:last-child td { border-bottom: none; }
table.safras tr.maturando td { color: var(--ink-400); }
table.safras tr.maturando td:first-child { color: var(--ink-600); }
table.safras tr:hover td { background: var(--paper-2); }
.pct-strong { font-weight: 600; color: var(--ink-900); }
.tr-maturando .pct-strong { color: var(--ink-500); font-weight: 500; }

.legend-row { display: flex; gap: 18px; padding: 12px 24px; border-top: 1px solid var(--hair); background: var(--paper-2); flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-500); }

/* Utility */
.row { display: flex; align-items: center; gap: 8px; }
.muted { color: var(--ink-400); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script id="exa-data" type="application/json">__EXA_DATA_JSON__</script>
<script type="text/babel" data-presets="react">

// ── Icons ──────────────────────────────────────────────────────────────────
const Ico = ({ children, size = 16, ...rest }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"
    {...rest}>{children}</svg>
);
const IcoFunnel    = (p) => <Ico {...p}><path d="M3 5h18l-7 8v6l-4 1v-7z" /></Ico>;
const IcoRetention = (p) => <Ico {...p}><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 4v5h-5" /></Ico>;
const IcoPerf      = (p) => <Ico {...p}><path d="M3 17 9 11l4 4 8-8" /><path d="M14 7h7v7" /></Ico>;
const IcoChat      = (p) => <Ico {...p}><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z" /></Ico>;
const IcoCluster   = (p) => <Ico {...p}><circle cx="12" cy="5" r="2" /><circle cx="5" cy="19" r="2" /><circle cx="19" cy="19" r="2" /><path d="M12 7v4M12 11l-5.5 6M12 11l5.5 6" /></Ico>;
const IcoSafra     = (p) => <Ico {...p}><path d="M12 22V12" /><path d="M12 12C12 7 8 5 4 5c0 5 3 8 8 7Z" /><path d="M12 12c0-5 4-7 8-7 0 5-3 8-8 7Z" /></Ico>;
const IcoChevRight = (p) => <Ico size={14} {...p}><path d="m9 6 6 6-6 6" /></Ico>;
const IcoChevDown  = (p) => <Ico size={14} {...p}><path d="m6 9 6 6 6-6" /></Ico>;
const IcoCal       = (p) => <Ico {...p}><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></Ico>;
const IcoSettings  = (p) => <Ico {...p}><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></Ico>;

// ── Data ───────────────────────────────────────────────────────────────────
const DEFAULT_DATA = {
  filters: { periodo: "—", data_inicio: "—", data_fim: "—", atualizado: "—" },
  header: { eyebrow: "Painel · Onboarding", title: "Safras", lede: "Funil diário de conversão por safra de cadastro.", base_analise: "Data de Cadastro", comparativo: "Semana anterior" },
  user: { name: "Analytics", role: "EXA", initials: "EX" },
  nav: [
    { key: "onboarding", label: "Onboarding", icon: "funnel" },
    { key: "retencao",   label: "Retenção",   icon: "retention" },
    { key: "performance",label: "Performance",icon: "perf" },
    { key: "clusters",   label: "Clusters",   icon: "cluster" },
    { key: "safras",     label: "Safras",     icon: "safra", active: true },
    { key: "chat",       label: "Chat",       icon: "chat" },
  ],
  kpis_1: [],
  kpis_2: [],
  funil: [],
  evolucao: [],
  maturacao_dias: 37,
  tabelas: { semana: [], mes: [] },
};

function loadData() {
  try {
    const el = document.getElementById("exa-data");
    if (el && el.textContent.trim()) {
      const p = JSON.parse(el.textContent);
      return {
        ...DEFAULT_DATA, ...p,
        filters:  { ...DEFAULT_DATA.filters,  ...(p.filters  || {}) },
        header:   { ...DEFAULT_DATA.header,   ...(p.header   || {}) },
        user:     { ...DEFAULT_DATA.user,     ...(p.user     || {}) },
        kpis_1:   p.kpis_1   || DEFAULT_DATA.kpis_1,
        kpis_2:   p.kpis_2   || DEFAULT_DATA.kpis_2,
        funil:    p.funil    || DEFAULT_DATA.funil,
        evolucao: p.evolucao || DEFAULT_DATA.evolucao,
        maturacao_dias: p.maturacao_dias || DEFAULT_DATA.maturacao_dias,
        tabelas:  { ...DEFAULT_DATA.tabelas, ...(p.tabelas || {}) },
      };
    }
  } catch (e) { console.warn("Parse error", e); }
  return DEFAULT_DATA;
}

const D = loadData();
const ICON_MAP = { funnel: IcoFunnel, retention: IcoRetention, perf: IcoPerf, cluster: IcoCluster, safra: IcoSafra, chat: IcoChat };

// ── Components ─────────────────────────────────────────────────────────────
function Sidebar() {
  return (
    <aside className="sidebar">
      <div className="sb-brand"><span className="wordmark">exa</span><span className="meta">app</span></div>
      <div>
        <div className="sb-section-label">Painéis</div>
        <nav className="sb-nav">
          {D.nav.map(it => {
            const I = ICON_MAP[it.icon] || IcoFunnel;
            return (
              <div key={it.key} className={`sb-item ${it.active ? "active" : ""}`}>
                <I className="ico" size={15} /><span>{it.label}</span>
                {it.active && <IcoChevRight className="chev" />}
              </div>
            );
          })}
        </nav>
      </div>
      <div>
        <div className="sb-section-label">Geral</div>
        <nav className="sb-nav">
          <div className="sb-item"><IcoSettings className="ico" size={15} /><span>Configurações</span></div>
        </nav>
      </div>
      <div className="sb-footer">
        <div className="sb-avatar">{D.user.initials}</div>
        <div style={{ display:"flex", flexDirection:"column", lineHeight:1.2 }}>
          <span style={{ color:"#fff", fontSize:12, fontWeight:500 }}>{D.user.name}</span>
          <span style={{ fontSize:10.5, fontFamily:"var(--font-mono)", color:"var(--ink-400)" }}>{D.user.role}</span>
        </div>
      </div>
    </aside>
  );
}

function Topbar() {
  const f = D.filters;
  return (
    <div className="topbar">
      <div className="tb-left">
        <div className="filter"><span className="lbl">Base</span><span className="val">Data de Cadastro</span><IcoChevDown className="chev" /></div>
        <div className="daterange">
          <IcoCal size={13} style={{ color:"var(--ink-400)" }} />
          <span>{f.data_inicio}</span><span className="arrow">→</span><span>{f.data_fim}</span>
        </div>
      </div>
      <div className="tb-right">
        <div className="status-pill"><span className="dot"></span><span>Atualizado {f.atualizado}</span></div>
      </div>
    </div>
  );
}

function PageHeader() {
  const h = D.header;
  return (
    <div className="page-head">
      <div>
        <div className="eyebrow">{h.eyebrow}</div>
        <h1>{h.title}</h1>
        <p className="lede">{h.lede}</p>
      </div>
      <div className="head-aside">
        <div className="head-base">Base de análise · <b>{h.base_analise}</b></div>
      </div>
    </div>
  );
}

function KpiRow({ items, cols }) {
  if (!items || !items.length) return null;
  return (
    <div className="resumo-grid" style={{ gridTemplateColumns: `repeat(${cols}, 1fr)` }}>
      {items.map((it, i) => (
        <div className={`resumo-kpi ${it.destaque ? "destaque" : ""}`} key={i}>
          <div className="r-lbl">{it.lbl}</div>
          <div className="r-val" style={it.cor ? { color: it.cor } : {}}>{it.val}</div>
          {it.sub && <div className="r-sub">{it.sub}</div>}
        </div>
      ))}
    </div>
  );
}

function ResumoKPIs() {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <KpiRow items={D.kpis_1} cols={5} />
      <KpiRow items={D.kpis_2} cols={4} />
    </div>
  );
}

const C_STD7 = "#1f9d57";     // STD ate 7d (verde)
const C_STDPOS = "#c66a00";   // STD pos 7d (laranja)

function EvolucaoChart() {
  const pts = D.evolucao || [];
  const [hi, setHi] = React.useState(null);
  if (!pts.length) return <div className="chart-wrap muted">Sem dados de evolução no período.</div>;

  const idx = hi == null ? pts.length - 1 : hi;
  const cur = pts[idx];

  // layout (viewBox — escala responsiva)
  const W = 920, H = 300, ML = 42, MR = 64, MT = 16, MB = 30;
  const iW = W - ML - MR, iH = H - MT - MB;
  const n = pts.length;
  const rawMax = Math.max(1, ...pts.map(p => Math.max(p.s7, p.sp)));
  const niceMax = Math.ceil(rawMax / 10) * 10 || 10;
  const xAt = i => ML + (n === 1 ? iW / 2 : iW * i / (n - 1));
  const yAt = v => MT + iH * (1 - v / niceMax);
  const path = key => pts.map((p, i) => (i ? "L" : "M") + xAt(i).toFixed(1) + " " + yAt(p[key]).toFixed(1)).join(" ");

  const ticks = [0, 0.25, 0.5, 0.75, 1].map(t => Math.round(niceMax * t));
  const step = Math.max(1, Math.ceil(n / 11));
  const showX = i => i === n - 1 || i % step === 0;

  return (
    <div className="chart-wrap">
      <div className="chart-head">
        <div>
          <div className="chart-title">Evolução do STD por semana</div>
          <div className="chart-sub">% do FTD Safra que fez 2º depósito · série completa desde abril</div>
        </div>
        <div className="chart-legend">
          <div className="li"><span className="sw"><i style={{ background: C_STD7 }}></i><b style={{ background: C_STD7, borderRadius: "50%" }}></b></span>STD até 7 dias</div>
          <div className="li"><span className="sw"><i style={{ background: C_STDPOS, borderTop: `2px dashed ${C_STDPOS}`, height: 0, background: "transparent" }}></i><b style={{ background: C_STDPOS }}></b></span>STD pós 7 dias</div>
        </div>
      </div>

      <div className="chart-readout">
        <span className="ro-wk">{cur.full}{cur.madura ? "" : " · em maturação"}</span>
        <span className="ro-v"><span className="ro-dot" style={{ background: C_STD7 }}></span>STD 7d <b>{String(cur.s7).replace(".", ",")}%</b> <span className="muted">({cur.std7})</span></span>
        <span className="ro-v"><span className="ro-dot" style={{ background: C_STDPOS }}></span>STD pós 7d <b>{String(cur.sp).replace(".", ",")}%</b> <span className="muted">({cur.stdpos})</span></span>
      </div>

      <svg className="chart-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
        {/* grid + eixo y */}
        <g className="chart-grid">
          {ticks.map((t, i) => (
            <g key={i}>
              <line x1={ML} x2={W - MR} y1={yAt(t)} y2={yAt(t)} className={t === 0 ? "chart-zero" : ""} />
              <text x={ML - 8} y={yAt(t) + 3} textAnchor="end" className="chart-axis-lbl">{t}%</text>
            </g>
          ))}
        </g>
        {/* eixo x */}
        {pts.map((p, i) => showX(i) && (
          <text key={i} x={xAt(i)} y={H - MB + 16} textAnchor="middle" className="chart-axis-lbl">{p.x}</text>
        ))}
        {/* crosshair */}
        <line className="chart-cross" x1={xAt(idx)} x2={xAt(idx)} y1={MT} y2={MT + iH} />
        {/* linhas */}
        <path d={path("sp")} fill="none" stroke={C_STDPOS} strokeWidth="2" strokeDasharray="5 4" strokeLinejoin="round" strokeLinecap="round" />
        <path d={path("s7")} fill="none" stroke={C_STD7} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {/* marcadores (quadrado = pos7, circulo = 7d) */}
        {pts.map((p, i) => (
          <rect key={"sp" + i} x={xAt(i) - 3.5} y={yAt(p.sp) - 3.5} width="7" height="7" fill={C_STDPOS}
            stroke="var(--card)" strokeWidth={i === idx ? 2 : 1} opacity={i === idx ? 1 : 0.9} />
        ))}
        {pts.map((p, i) => (
          <circle key={"s7" + i} cx={xAt(i)} cy={yAt(p.s7)} r={i === idx ? 5 : 3.5} fill={C_STD7}
            stroke="var(--card)" strokeWidth={i === idx ? 2 : 1} />
        ))}
        {/* rotulos diretos no ultimo ponto */}
        <text x={xAt(n - 1) + 9} y={yAt(pts[n - 1].s7) + 3} className="chart-axis-lbl" fill={C_STD7} style={{ fontWeight: 600 }}>7d</text>
        <text x={xAt(n - 1) + 9} y={yAt(pts[n - 1].sp) + 3} className="chart-axis-lbl" fill={C_STDPOS} style={{ fontWeight: 600 }}>pós 7d</text>
        {/* areas de hover */}
        {pts.map((p, i) => (
          <rect key={"hit" + i} className="chart-hit" x={ML + (iW * (i - 0.5) / Math.max(1, n - 1))}
            y={MT} width={iW / Math.max(1, n - 1)} height={iH}
            onMouseEnter={() => setHi(i)} onMouseLeave={() => setHi(null)} />
        ))}
      </svg>
    </div>
  );
}

function FunilSection() {
  const steps = D.funil;
  if (!steps.length) return <div className="funil-wrap muted">Sem dados no período selecionado.</div>;
  return (
    <div className="funil-wrap">
      {steps.map((s, i) => (
        <div className="funil-step" key={i}>
          <div className="funil-lbl">{s.label}</div>
          <div className="funil-track">
            <div className={`funil-fill ${s.base_alt ? "alt" : ""}`} style={{ width: `${s.pct_barra}%` }}>
              <span className="funil-fill-lbl">{s.pct_barra}%</span>
            </div>
          </div>
          <div className="funil-right">
            <span className="funil-qtd">{s.qtd}</span>
            <span className="funil-pct">{s.pct_base}% {s.base_lbl}</span>
          </div>
        </div>
      ))}
      <div className="funil-note">
        <b>FTD Safra</b> = cadastro e 1º depósito no mesmo mês. As janelas <b>D0–D7</b> e o <b>STD</b> são calculados <b>sobre o FTD Safra</b>.
      </div>
    </div>
  );
}

function TabelaSafras() {
  const [tab, setTab] = React.useState("semana");
  const rows = D.tabelas[tab] || [];
  const tabLabels = { semana: "Semana", mes: "Mês" };

  return (
    <div className="tabela-wrap">
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"16px 20px 0" }}>
        <div className="tabs">
          {Object.keys(tabLabels).map(k => (
            <button key={k} className={`tab-btn ${tab === k ? "active" : ""}`} onClick={() => setTab(k)}>
              {tabLabels[k]}
            </button>
          ))}
        </div>
        <span style={{ fontSize:11, color:"var(--ink-400)", fontFamily:"var(--font-mono)" }}>
          {tab === "semana" ? "semana domingo → sábado" : ""}
        </span>
      </div>
      <div className="tabela-scroll" style={{ padding: "14px 0 0" }}>
        <table className="safras">
          <thead>
            <tr>
              <th>Safra</th>
              <th>Cadastros</th>
              <th>FTD Safra</th>
              <th>Conv.</th>
              <th>Extra Ant.</th>
              <th>D0</th>
              <th>D0–D7</th>
              <th>Tkt D0</th>
              <th>Tkt D7</th>
              <th>STD 7d</th>
              <th>STD pós 7d</th>
              <th>Tkt STD 7d</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i} className={r.status === "Em maturação" ? "maturando" : ""}>
                <td>{r.periodo}</td>
                <td>{r.cadastros}</td>
                <td className="pct-strong">{r.ftd_safra}</td>
                <td>{r.pct_conv}%</td>
                <td>{r.ftd_extra}</td>
                <td>{r.pct_d0}%</td>
                <td>{r.pct_d0_d7}%</td>
                <td>{r.tkt_d0}</td>
                <td>{r.tkt_d7}</td>
                <td className="pct-strong std-main">{r.pct_std_7d}%</td>
                <td>{r.pct_std_pos7}%</td>
                <td>{r.tkt_std7}</td>
                <td><span className={`badge ${r.status_cor}`}>{r.status}</span></td>
              </tr>
            ))}
            {!rows.length && (
              <tr><td colSpan={13} style={{ textAlign:"center", color:"var(--ink-400)", padding:"24px" }}>Sem dados nesta granularidade.</td></tr>
            )}
          </tbody>
        </table>
      </div>
      <div className="legend-row">
        <div className="legend-item"><span className="badge warn">Em maturação</span> menos de {D.maturacao_dias} dias desde o fim da safra — janelas de FTD (7d) e STD (até 30d) ainda não fecharam, números podem subir.</div>
        <div className="legend-item"><span className="badge good">Completa</span> {D.maturacao_dias}+ dias — comparável com outras safras completas.</div>
      </div>
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────────────────
function App() {
  return (
    <div className="app">
      <Sidebar />
      <div className="main">
        <Topbar />
        <div className="page">
          <PageHeader />

          <div className="section">
            <div className="section-head">
              <span className="tag">Resumo do Período</span>
              <div className="rule" />
            </div>
            <ResumoKPIs />
          </div>

          <div className="section">
            <div className="section-head">
              <span className="tag">Funil de Conversão · Agregado do Período</span>
              <div className="rule" />
            </div>
            <FunilSection />
          </div>

          <div className="section">
            <div className="section-head">
              <span className="tag">Evolução · Segundo Depósito (STD)</span>

          </div>

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// Auto-resize
function sendHeight() {
  var h = document.documentElement.scrollHeight;
  try { if (window.frameElement) { window.frameElement.style.height = h + "px"; window.frameElement.setAttribute("height", h); } } catch(e) {}
  try { window.parent.postMessage({ type: "streamlit:setFrameHeight", height: h }, "*"); } catch(e) {}
}
[150, 400, 900, 1800].forEach(function(t){ setTimeout(sendHeight, t); });
new ResizeObserver(sendHeight).observe(document.documentElement);

</script>
</body>
</html>
