<!doctype html>
<html lang="pt-BR">
<head>
<title>exa — Retenção</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;450;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
:root {
  /* Ink */
  --ink-900: #0a0d14;
  --ink-800: #14171f;
  --ink-700: #1f242e;
  --ink-600: #2c3340;
  --ink-500: #4a5160;
  --ink-400: #6b7280;
  --ink-300: #8a93a3;
  --ink-200: #b9bfc9;
  --ink-100: #dde1e8;
  --ink-50:  #eef0f4;

  /* Surface */
  --paper:   #fbfaf7;
  --paper-2: #f5f3ee;
  --card:    #ffffff;
  --hair:    #e7e4dc;
  --hair-2:  #efece5;

  /* Accents — restrained */
  --exa-700: #1a2dc9;
  --exa-600: #2540ea;
  --exa-500: #3a5bff;
  --exa-100: #e6ebff;
  --exa-50:  #f2f4ff;

  --good-700: #15683a;
  --good-500: #1f9d57;
  --good-50:  #ecf6ef;

  --warn-700: #8a4b00;
  --warn-500: #c66a00;

  --bad-700:  #9a1f2a;
  --bad-600:  #b8232f;
  --bad-500:  #d62a39;
  --bad-50:   #fbecee;

  /* Type */
  --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-serif: "Instrument Serif", "Times New Roman", serif;

  /* Layout */
  --sidebar-w: 232px;
  --content-pad: 32px;
  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-feature-settings: "ss01", "cv11";
  color: var(--ink-900);
  background: var(--paper);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }

/* ---------- LAYOUT ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* ---------- SIDEBAR ---------- */
.sidebar {
  background: var(--ink-900);
  color: var(--ink-200);
  padding: 22px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sb-brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 4px 8px 0;
}
.sb-brand .wordmark {
  font-family: var(--font-serif);
  font-size: 38px;
  font-style: italic;
  color: #fff;
  letter-spacing: -0.02em;
  line-height: 1;
}
.sb-brand .meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-400);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.sb-section-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-400);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0 10px 6px;
}
.sb-nav { display: flex; flex-direction: column; gap: 1px; }
.sb-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  color: var(--ink-200);
  font-size: 13px;
  font-weight: 450;
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
  border: 1px solid transparent;
}
.sb-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
.sb-item.active {
  background: rgba(255,255,255,0.06);
  color: #fff;
  border-color: rgba(255,255,255,0.08);
}
.sb-item .ico { color: var(--ink-300); }
.sb-item.active .ico { color: var(--exa-500); }
.sb-item .chev { margin-left: auto; opacity: 0.4; }

.sb-footer {
  margin-top: auto;
  padding: 12px 8px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink-300);
  font-size: 12px;
}
.sb-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2540ea, #6b7280);
  display: grid; place-items: center;
  color: #fff; font-size: 11px; font-weight: 600;
  letter-spacing: 0.02em;
}

/* ---------- MAIN ---------- */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Top filter bar */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px var(--content-pad);
  border-bottom: 1px solid var(--hair);
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: saturate(140%) blur(8px);
  flex-wrap: wrap;
  row-gap: 8px;
}
.tb-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; row-gap: 8px; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.filter {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px 6px 12px;
  background: var(--card);
  border: 1px solid var(--hair);
  border-radius: 7px;
  font-size: 12.5px;
  color: var(--ink-700);
  cursor: pointer;
  transition: border-color 120ms ease, background 120ms ease;
}
.filter:hover { border-color: var(--ink-200); }
.filter .lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-400);
}
.filter .val { font-weight: 500; color: var(--ink-800); }
.filter .chev { color: var(--ink-400); }

.daterange {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--card);
  border: 1px solid var(--hair);
  border-radius: 7px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-700);
}
.daterange .arrow { color: var(--ink-300); }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px 5px 8px;
  border: 1px solid var(--hair);
  border-radius: 999px;
  background: var(--card);
  font-size: 11.5px;
  color: var(--ink-500);
  font-family: var(--font-mono);
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--good-500);
  box-shadow: 0 0 0 3px rgba(31,157,87,0.15);
}

/* Page header */
.page {
  padding: 28px var(--content-pad) 56px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding-bottom: 8px;
}
.page-head .eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-400);
  margin-bottom: 10px;
}
.page-head h1 {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  font-size: 56px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink-900);
  margin: 0 0 10px;
}
.page-head .lede {
  font-size: 15px;
  color: var(--ink-500);
  max-width: 56ch;
  letter-spacing: -0.005em;
}
.page-head .head-aside {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.head-base {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-400);
}
.head-base b { color: var(--ink-800); font-weight: 500; }

/* Section header */
.section { display: flex; flex-direction: column; gap: 14px; }
.section-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-head .tag {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-500);
}
.section-head .tag.churn { color: var(--bad-600); }
.section-head .rule {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--ink-100), transparent);
}
.section-head .rule.churn {
  background: linear-gradient(to right, rgba(214,42,57,0.35), transparent);
}

/* KPI grid */
.kpi-grid {
  display: grid;
  gap: 1px;
  background: var(--hair);
  border: 1px solid var(--hair);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.kpi-grid.cols-6 { grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); }
.kpi-grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

.kpi {
  background: var(--card);
  padding: 16px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 132px;
  position: relative;
  min-width: 0;
}
.kpi.churn::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--bad-500);
  opacity: 0.9;
}
.kpi .label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-400);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kpi .label > span:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
}
.kpi .label .help {
  color: var(--ink-200);
  cursor: help;
  display: inline-flex;
}
.kpi .value {
  font-family: var(--font-sans);
  font-feature-settings: "tnum" 1, "ss01" 1;
  font-size: clamp(22px, 1.9vw, 28px);
  font-weight: 500;
  letter-spacing: -0.025em;
  color: var(--ink-900);
  line-height: 1;
  white-space: nowrap;
}
.kpi .value .unit {
  font-size: 0.6em;
  color: var(--ink-400);
  font-weight: 400;
  margin-left: 2px;
}
.kpi .foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  gap: 8px;
}
.kpi .delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 4px;
}
.delta.up { color: var(--good-700); background: var(--good-50); }
.delta.down { color: var(--bad-700); background: var(--bad-50); }
.delta.flat { color: var(--ink-500); background: var(--ink-50); }
.kpi .sub {
  font-size: 11.5px;
  color: var(--ink-400);
  letter-spacing: -0.005em;
}
.kpi .sub b { color: var(--ink-700); font-weight: 500; }

.spark { display: block; }

/* Lower row: funnel + chart */
.two-col {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  gap: 16px;
}
@media (max-width: 1100px) {
  .two-col { grid-template-columns: 1fr; }
}

.card {
  background: var(--card);
  border: 1px solid var(--hair);
  border-radius: var(--radius-lg);
  padding: 22px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-head h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink-900);
}
.card-head .sub {
  font-size: 12px;
  color: var(--ink-400);
  margin-top: 2px;
  letter-spacing: -0.005em;
}
.card-head .tabs {
  display: inline-flex;
  background: var(--paper-2);
  border-radius: 6px;
  padding: 2px;
  border: 1px solid var(--hair);
}
.card-head .tabs button {
  border: none;
  background: transparent;
  font-size: 11.5px;
  padding: 4px 10px;
  border-radius: 4px;
  color: var(--ink-500);
  font-weight: 500;
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
}
.card-head .tabs button.on {
  background: #fff;
  color: var(--ink-900);
  box-shadow: 0 1px 1px rgba(10,13,20,0.05), 0 0 0 1px var(--hair);
}

/* Funnel */
.funnel { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.funnel-row {
  display: grid;
  grid-template-columns: 96px 1fr 92px;
  align-items: center;
  gap: 14px;
  padding: 6px 0;
}
.funnel-stage {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.funnel-stage .name {
  font-size: 12px;
  color: var(--ink-700);
  font-weight: 500;
}
.funnel-stage .num {
  font-family: var(--font-mono);
  font-feature-settings: "tnum" 1;
  font-size: 11px;
  color: var(--ink-400);
}
.bar-track {
  height: 36px;
  background: var(--paper-2);
  border-radius: 6px;
  position: relative;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--ink-900);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
  color: #fff;
  font-family: var(--font-mono);
  font-feature-settings: "tnum" 1;
  font-size: 11.5px;
  font-weight: 500;
}
.bar-fill.blue { background: var(--exa-600); }
.bar-fill.blue-2 { background: var(--exa-500); }
.bar-fill.blue-3 { background: #8aa3ff; }
.bar-fill.blue-4 { background: #c6d2ff; color: var(--ink-700); }
.funnel-conv {
  font-family: var(--font-mono);
  font-feature-settings: "tnum" 1;
  font-size: 11.5px;
  color: var(--ink-500);
  text-align: right;
}
.funnel-conv b { color: var(--ink-900); font-weight: 500; }
.funnel-conv.dim { color: var(--ink-300); }

.funnel-arrow {
  grid-column: 2 / 3;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 0 0 10px;
  height: 22px;
  position: relative;
}
.funnel-arrow .line {
  flex: 1;
  height: 1px;
  background: repeating-linear-gradient(to right, var(--ink-200) 0 4px, transparent 4px 8px);
}
.funnel-arrow .chip {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-500);
  background: var(--paper);
  padding: 1px 7px;
  border: 1px solid var(--hair);
  border-radius: 4px;
}
.funnel-arrow .chip.good { color: var(--good-700); background: var(--good-50); border-color: rgba(31,157,87,0.2); }
.funnel-arrow .chip.bad  { color: var(--bad-700); background: var(--bad-50); border-color: rgba(214,42,57,0.2); }

/* Chart card */
.chart-wrap {
  position: relative;
  width: 100%;
  height: 280px;
}
.legend {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 11.5px;
  color: var(--ink-500);
  font-family: var(--font-mono);
}
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; }
.legend .sw.bars { background: var(--exa-100); border: 1px solid var(--exa-500); }
.legend .sw.line { background: var(--exa-600); height: 2px; border-radius: 1px; }

/* Notes row */
.notes {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-top: 8px;
}
.note {
  border: 1px solid var(--hair);
  border-radius: var(--radius);
  padding: 14px 16px;
  background: var(--card);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.note .lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-400);
}
.note .v {
  font-size: 13px;
  color: var(--ink-800);
  letter-spacing: -0.005em;
}
.note .v b { font-weight: 600; }

/* utility */
.row { display: flex; align-items: center; gap: 8px; }
.gap-2 { gap: 6px; } .gap-4 { gap: 12px; }
.muted { color: var(--ink-400); }


/* ============================================================
   RETENÇÃO PAGE
   ============================================================ */

/* Simple KPI card (no sparkline) used in retention */
.kpi-simple {
  background: var(--card);
  border: 1px solid var(--hair);
  border-radius: var(--radius);
  padding: 18px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 122px;
  position: relative;
  transition: border-color .15s ease;
}
.kpi-simple:hover { border-color: var(--ink-200); }
.kpi-simple .label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-400);
}
.kpi-simple .label .help { color: var(--ink-300); display: inline-flex; }
.kpi-simple .value {
  font-family: var(--font-sans);
  font-feature-settings: "tnum" 1, "ss01" 1;
  font-size: clamp(28px, 2.3vw, 36px);
  font-weight: 500;
  letter-spacing: -0.028em;
  color: var(--ink-900);
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 2px;
}
.kpi-simple .value .unit {
  font-size: 0.5em;
  color: var(--ink-400);
  font-weight: 400;
  margin-left: 2px;
}
.kpi-simple .sub {
  font-size: 11.5px;
  color: var(--ink-400);
  margin-top: auto;
}

/* Cohort heatmap */
.cohort-card {
  background: var(--card);
  border: 1px solid var(--hair);
  border-radius: var(--radius);
  padding: 0;
  overflow: hidden;
}
.cohort-head-bar {
  padding: 14px 18px;
  border-bottom: 1px solid var(--hair);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.cohort-head-bar h3 {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-500);
}
.cohort-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
}
.cohort-table thead th {
  background: var(--exa-700);
  color: #fff;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 14px 12px;
  text-align: center;
}
.cohort-table thead th:first-child { text-align: left; padding-left: 22px; }
.cohort-table tbody td {
  padding: 8px 8px;
  font-family: var(--font-mono);
  font-feature-settings: "tnum" 1;
  font-size: 12px;
  text-align: center;
  border-bottom: 1px solid var(--hair-2);
}
.cohort-table tbody tr:last-child td { border-bottom: none; }
.cohort-table tbody td.cohort-label {
  text-align: left;
  padding-left: 22px;
  color: var(--ink-700);
  font-family: var(--font-sans);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
/* Pill cells — color scale by retention bucket */
.cohort-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 64px;
  height: 28px;
  padding: 0 12px;
  border-radius: 999px;
  background: var(--paper-2);
  color: var(--ink-500);
}
.cohort-cell.b-100 { background: var(--exa-700); color: #fff; }
.cohort-cell.b-85  { background: var(--exa-600); color: #fff; }
.cohort-cell.b-45  { background: var(--exa-500); color: #fff; }
.cohort-cell.b-30  { background: #8aa3ff; color: var(--ink-900); }
.cohort-cell.b-15  { background: #c6d2ff; color: var(--ink-800); }
.cohort-cell.b-lt15 { background: var(--paper-2); color: var(--ink-500); }
.cohort-cell.b-nan { background: var(--paper-2); color: var(--ink-300); }

.cohort-legend {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 18px 18px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-500);
}
.cohort-legend .lbl { color: var(--ink-400); letter-spacing: 0.06em; }
.cohort-legend .chip {
  padding: 3px 10px;
  border-radius: 999px;

function bucket(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "b-nan";
  if (v >= 100) return "b-100";
  if (v >= 85)  return "b-85";
  if (v >= 45)  return "b-45";

}

}

// ---- Average retention curve (SVG) -------------------------------------
function RetentionCurve({ points, labels, height = 280 }) {
  const W = 760, H = height;
  const padL = 44, padR = 24, padT = 22, padB = 36;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const n = points.length;
  const maxY = 100;
  const stepX = innerW / (n - 1);
  const y = (v) => padT + innerH - (Math.max(0, v) / maxY) * innerH;
  const x = (i) => padL + stepX * i;
  const pts = points.map((v, i) => [x(i), y(v)]);
  const d = pts.map(([px, py], i) => (i === 0 ? `M${px},${py}` : `L${px},${py}`)).join(" ");
  const area = d + ` L${pts[n-1][0]},${padT + innerH} L${pts[0][0]},${padT + innerH} Z`;
  const yTicks = [0, 20, 40, 60, 80, 100];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none">
      <defs>
        <linearGradient id="curveGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#3a5bff" stopOpacity="0.20" />
          <stop offset="100%" stopColor="#3a5bff" stopOpacity="0.02" />
        </linearGradient>
      </defs>
      {yTicks.map((t) => {
        const yp = y(t);
        return (
          <g key={t}>
            <line x1={padL} x2={W - padR} y1={yp} y2={yp} stroke="#efece5" strokeWidth="1" />
            <text x={padL - 8} y={yp + 3.5} textAnchor="end"
              fontFamily="'Geist Mono', monospace" fontSize="10" fill="#8a93a3">{t}%</text>
          </g>
        );
      })}
      <path d={area} fill="url(#curveGrad)" />
      <path d={d} fill="none" stroke="#2540ea" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map(([px, py], i) => (
        <g key={i}>
          <circle cx={px} cy={py} r="3.4" fill="#fff" stroke="#2540ea" strokeWidth="1.5" />
          {i > 0 && (
            <text x={px} y={py - 10} textAnchor="middle"
              fontFamily="'Geist Mono', monospace" fontSize="10" fill="#4a5160" fontWeight="500">
              {points[i].toFixed(points[i] < 10 ? 1 : 0)}%
            </text>
          )}
        </g>
      ))}
      {labels.map((l, i) => (
        <text key={i} x={x(i)} y={H - 12} textAnchor="middle"
          fontFamily="'Geist Mono', monospace" fontSize="10.5" fill="#6b7280" letterSpacing="0.06em">{l}</text>
      ))}
    </svg>
  );
}

// Sparkline (matches Onboarding)
function Sparkline({ data, color = "#2540ea", width = 96, height = 28, fillOpacity = 0.12 }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const pad = 2;
  const stepX = (width - pad * 2) / (data.length - 1);
  const pts = data.map((v, i) => {
    const x = pad + i * stepX;
    const y = pad + (height - pad * 2) * (1 - (v - min) / range);
    return [x, y];
  });
  const d = pts.map(([x, y], i) => (i === 0 ? `M${x},${y}` : `L${x},${y}`)).join(" ");
  const area = d + ` L${pts[pts.length - 1][0]},${height - pad} L${pts[0][0]},${height - pad} Z`;
  const last = pts[pts.length - 1];
  return (
    <svg className="spark" width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <path d={area} fill={color} opacity={fillOpacity} />
      <path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={last[0]} cy={last[1]} r="2.2" fill={color} />
    </svg>
  );
}

const IcoArrowUp = (p) => <Ico size={12} {...p}><path d="m6 14 6-6 6 6" /></Ico>;

function Delta({ d }) {

}

}

function UsersTableCard() {
  const t = D.usersTable;
  const fmt = (v) => v === null || v === undefined || Number.isNaN(v)
    ? <span className="muted">—</span>
    : v.toLocaleString("pt-BR");
  return (
    <div className="card" style={{ padding: 0 }}>
      <div className="card-head" style={{ padding: "16px 18px", marginBottom: 0, borderBottom: "1px solid var(--hair)" }}>
        <div>
          <h3>{t.title}</h3>
          <div className="sub">{t.subtitle}</div>
        </div>
        <div className="tabs">
          <button className="on">Abs.</button>
          <button>%</button>
        </div>
      </div>
      <table className="users-table">
        <thead>
          <tr>
            <th>Cohort</th>
            {t.cols.map((c) => <th key={c}>{c}</th>)}
          </tr>
        </thead>
        <tbody>
          {t.rows.map((r) => (
            <tr key={r.label}>
              <td>{r.label}</td>
              {r.values.map((v, i) => <td key={i}>{fmt(v)}</td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function App() {
  return (
    <div className="app">
      <Sidebar />
      <main className="main" data-screen-label="02 Retenção">
        <Topbar />
        <div className="page">
          <PageHeader />

          <section className="section">
            <div className="section-head">
              <span className="tag">Indicadores de Retenção</span>
              <span className="rule"></span>
            </div>
            <div className="kpi-grid cols-6">
              {D.kpis.map((k) => <KpiCard key={k.key} k={k} />)}
            </div>
          </section>

          <section className="section">
            <CohortHeatmap />
          </section>

          <section className="two-col split">
            <CurveCard />
            <UsersTableCard />
          </section>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// Auto-resize: informa ao Streamlit a altura real do conteúdo
function sendHeight() {
  const h = document.documentElement.scrollHeight;
  window.parent.postMessage({ type: "streamlit:setFrameHeight", height: h }, "*");
}
// Aguarda o React renderizar e observa mudanças subsequentes
setTimeout(sendHeight, 200);
new ResizeObserver(sendHeight).observe(document.body);

</script>
</body>
</html>
